; ---------------------------------------------------------------------------------------------
;  KNXnet/IP product flag combinations - build only, no application
;
;  The other examples build each mask on its own. A product picks its BAU from the mask PLUS
;  KNX_TUNNELING, and that is what decides whether the tunnel server, the IP data link layer and
;  the coupler gates in data_link_layer are compiled at all. Those combinations were built
;  nowhere, which is how a drift against the pinned TPUart reached a release unnoticed.
;
;  All three MCUs the products ship on, because the flags differ per architecture and a break can
;  hide on the one that is not built.
; ---------------------------------------------------------------------------------------------
[platformio]
src_dir = .

[product_ipif]
build_flags =
  -DMASK_VERSION=0x07B0
  -DKNX_TUNNELING=16
  -DOPENKNX_HW_BUSMON
  -Wno-unknown-pragmas

[product_ipro]
build_flags =
  -DMASK_VERSION=0x091A
  -DKNX_TUNNELING=16
  -Wno-unknown-pragmas

[base_esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32dev
framework = arduino
lib_deps =
  knx

[base_rp]
framework = arduino
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#e89b79e
platform_packages = framework-arduinopico @ https://github.com/earlephilhower/arduino-pico/releases/download/4.5.4/rp2040-4.5.4.zip
board_build.core = earlephilhower
lib_deps =
  knx

[rp_flags]
build_flags =
  -DKNX_FLASH_SIZE=4096
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_RTTI

;--- IP-Interface: mask 07B0 with tunnelling -----------------------------------
[env:esp32_ipif]
extends = base_esp32
build_flags = ${product_ipif.build_flags}

[env:rp2040_ipif]
extends = base_rp
board = rpipico
build_flags =
  ${product_ipif.build_flags}
  ${rp_flags.build_flags}

[env:rp2350_ipif]
extends = base_rp
board = rpipico2
build_flags =
  ${product_ipif.build_flags}
  ${rp_flags.build_flags}

;--- IP-Router: mask 091A with tunnelling ---------------------------------------
[env:esp32_ipro]
extends = base_esp32
build_flags = ${product_ipro.build_flags}

[env:rp2040_ipro]
extends = base_rp
board = rpipico
build_flags =
  ${product_ipro.build_flags}
  ${rp_flags.build_flags}

[env:rp2350_ipro]
extends = base_rp
board = rpipico2
build_flags =
  ${product_ipro.build_flags}
  ${rp_flags.build_flags}
