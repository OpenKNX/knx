;PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html




;--- ESP32 -----------------------------------------------
[env:esp32dev_ip_tp]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32dev
framework = arduino
lib_deps =
  ;https://github.com/tzapu/WiFiManager.git
  knx
  https://github.com/OpenKNX/tpuart.git

build_flags =
  -DMASK_VERSION=0x091A
  -Wno-unknown-pragmas


  ;--- RP2040 -----------------------------------------------
[env:rp2040]
framework = arduino
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#22a4cc6
platform_packages = framework-arduinopico @ https://github.com/earlephilhower/arduino-pico/releases/download/5.4.1/rp2040-5.4.1.zip
board = rpipico
board_build.core = earlephilhower


lib_deps =
  knx
  https://github.com/OpenKNX/tpuart.git

lib_ldf_mode = deep+

build_flags =
  -DMASK_VERSION=0x091A
  -DKNX_FLASH_SIZE=4096
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_RTTI
  -Wno-unknown-pragmas

    ;--- RP2040 -----------------------------------------------
[env:rp2040_tunneling]
extends = rp2040
build_flags =
  ${rp2040.build_flags}
  -DKNX_TUNNELING=16