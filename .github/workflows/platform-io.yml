name: PlatformIO CI

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
#    strategy:
#      matrix:
#        example: [path/to/test/file.c, examples/file.ino, path/to/test/directory]

    steps:
    - uses: actions/checkout@v6
    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install platformio
 #   - name: Build knx-usb
 #     run: platformio ci --lib="." --project-conf=examples/knx-usb/platformio-ci.ini examples/knx-usb/src/main.cpp
    - name: Build knx-demo
      run: platformio ci --lib="." --project-conf=examples/knx-demo/platformio-ci.ini examples/knx-demo/knx-demo.ino
    - name: Build knx-demo-coupler
      run: platformio ci --lib="." --project-conf=examples/knx-demo-coupler/platformio-ci.ini examples/knx-demo-coupler/knx-demo-coupler.ino

  openknx-oams:
    uses: openknx/actions/.github/workflows/openknx-ofm-check.yml@v0
    with:

      # TODO use ./openknx.json#ofm.prefix
      # note: dummy value as knx has not OFM-prefix
      ofm_prefix: KNX

      # TODO use ./openknx.json#ofm.ref_oam
      oam: OAM-StateEngine
      # TODO FIXME: oam_ref: v1
      # TODO use default /OAM-Repo/openknx.json#ofm.prefix
      target: DFA16-Release
      KNXPROD_PREFIX: StateEngine